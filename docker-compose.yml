version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sankalp_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://sankalp_user:sankalp_password@postgres:5432/sankalp_db
      - SECRET_KEY=sankalp_super_secret_jwt_key_2026_change_in_production
      - AI_PROVIDER=mock
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sankalp_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sankalp_postgres
    environment:
      POSTGRES_USER: sankalp_user
      POSTGRES_PASSWORD: sankalp_password
      POSTGRES_DB: sankalp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sankalp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
